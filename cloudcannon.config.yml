paths:
  uploads: uploads
  dam_uploads: ''
  static: ''
  dam_static: ''
  collections: ''
  data: _data
  layouts: _layouts
  includes: _includes

collections_config:
  data:
    path: _data
    output: false
    icon: notes
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  pages:
    path: ''
    output: true
    filter: strict
    icon: notes
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false


collection_groups:
  - heading: Website
    collections:
      - pages
      - data
  - heading: Blog
    collections:
      - posts
      - drafts



_inputs:
  layout:
    type: auto
    hidden: true
    cascade: true
  categories:
    type: multiselect
    options:
      allow_create: true
      empty_type: array
    cascade: true
  tags:
    type: multiselect
    options:
      allow_create: true
      empty_type: array
    cascade: true
 
  
_select_data:
  styles:
    - Clean
    - ColorfulLight
    - ColorfulDark
    - Plain
  logos:
    - Standard
    - Padded
    - Border
    - Circle
    - Circle-Border
    - Octo
    - Ensign
    - Ensign2
  actions:
    - Signup
    - Order
    - Call
    - Email
    - Directions
  fonts:
    - Roboto
    - Vollkorn
    - Lobster
  buttons:
    - Round
    - Soft
    - Hard
    - Sharp
    - Pointy
    - Octagon
  banners:
    - Standard
    - Round
    - Hex
    - Split


_structures: {}
_editables: {}
data_config: {}
timezone: Etc/UTC



      
      
