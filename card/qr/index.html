<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Card</title>
<meta name="theme-color" content="#e1251b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Card">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/sales.whileyoureintown.com/apple-touch-icon.png">
<link rel="manifest" href="/sales.whileyoureintown.com/card/manifest.webmanifest">
<style>
@font-face{font-family:"WYIT";src:url("/sales.whileyoureintown.com/fonts/wyit.ttf") format("truetype");font-display:swap}
html,body{margin:0;height:100%;background:#e1251b;color:#fff}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;text-align:center}
h1{font:34px/1 "WYIT","Arial Narrow",Impact,sans-serif;text-transform:uppercase;margin:0}
.qr{background:#fff;padding:18px;border-radius:24px;width:min(78vw,360px)}
.qr img{display:block;width:100%;height:auto;image-rendering:pixelated}
p{margin:0;opacity:.92}
.dock{display:flex;gap:10px;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:#b81c14}
.dock a,.dock button{flex:1;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:12px;padding:14px 6px;font-family:inherit;font-weight:600;font-size:14px;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Scan to save my info</h1>
  <div class="qr"><img src="/sales.whileyoureintown.com/card/kevin-qr.png" alt="QR code for Kevin LeBaron's card"></div>
  <p>Kevin LeBaron · While You're In Town</p>
</main>
<div class="dock">
  <button id="copy" type="button">Copy link</button>
  <a id="text" href="sms:?&body=Kevin%20LeBaron%2C%20While%20You're%20In%20Town%3A%20https%3A%2F%2Fkevaleb.github.io%2Fsales.whileyoureintown.com%2Fcard%2F">Text my card</a>
  <a href="/sales.whileyoureintown.com/card/kevin-card-lockscreen.png" target="_blank" rel="noopener">QR picture</a>
</div>
<script>
document.getElementById('copy').addEventListener('click',function(){var u='https://kevaleb.github.io/sales.whileyoureintown.com/card/',b=this;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy link'},1500)}).catch(function(){prompt('Copy this link',u)});});
if(navigator.share){var t=document.getElementById('text');t.textContent='Share my card';t.addEventListener('click',function(e){e.preventDefault();navigator.share({title:'Kevin LeBaron · While You\'re In Town',url:'https://kevaleb.github.io/sales.whileyoureintown.com/card/'}).catch(function(){});});}
</script>
</body>
</html>
